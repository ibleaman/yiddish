name: Test, build, and publish to PyPI

on: push

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Fetch data for lookup tables (loshn-koydesh-pronunciation, hasidify_lexicon) as pseudo "submodules", at the versions pinned in data-versions.txt
      run: bash fetch_data.sh
    - name: Install pytest
      run: python -m pip install pytest
    - name: Run tests
      run: python -m pytest -q

  build:
    name: Build distributions 📦
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Fetch data for lookup tables (loshn-koydesh-pronunciation, hasidify_lexicon) as pseudo "submodules", at the versions pinned in data-versions.txt
      run: bash fetch_data.sh
    - name: Install pypa/build and twine
      run: python -m pip install build twine
    - name: Build a binary wheel and a source tarball
      run: python -m build --sdist --wheel --outdir dist/ .
    - name: Check the package metadata
      run: python -m twine check dist/*
    - name: Smoke-test the built wheel in a clean environment
      run: |
        python -m venv /tmp/smoke
        /tmp/smoke/bin/pip install dist/*.whl
        cd /tmp
        /tmp/smoke/bin/python -c "
        import yiddish
        assert yiddish.respell_loshn_koydesh('משפּחה') == 'מישפּאָכע', 'loshn-koydesh data missing'
        assert yiddish.hasidify('שנײיִק') == 'שנייאיג', 'hasidic lexicon data missing'
        print('wheel OK:', yiddish.__file__)
        "
    - name: Store the distributions
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish:
    name: Publish distributions 📦 to PyPI
    # Only publish when a tag is pushed (i.e., when a release is made)
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/yiddish/
    permissions:
      id-token: write  # required for PyPI Trusted Publishing
    steps:
    - name: Download the distributions
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
