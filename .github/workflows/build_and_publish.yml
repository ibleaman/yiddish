name: Publish Python 🐍 distributions 📦 to PyPI

on: push

jobs:
  build:
    name: Build distributions 📦
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Fetch data for lookup tables (loshn-koydesh-pronunciation, hasidify_lexicon) as pseudo "submodules", at the versions pinned in data-versions.txt
      run: bash fetch_data.sh
    - name: Install pypa/build
      run: python -m pip install build
    - name: Build a binary wheel and a source tarball
      run: python -m build --sdist --wheel --outdir dist/ .
    - name: Store the distributions
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish:
    name: Publish distributions 📦 to PyPI
    # Only publish when a tag is pushed (i.e., when a release is made)
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/yiddish/
    permissions:
      id-token: write  # required for PyPI Trusted Publishing
    steps:
    - name: Download the distributions
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
